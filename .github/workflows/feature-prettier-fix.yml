name: Feature Prettier Fix
on:
  push:
    branches:
      - feat/project-manager-integration-inbox
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/control-plane/src/integrations/inbox.ts apps/control-plane/src/integrations/routes.test.ts apps/control-plane/src/persistence.integration.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-plane/src/integrations/inbox.ts apps/control-plane/src/integrations/routes.test.ts apps/control-plane/src/persistence.integration.test.ts
          git commit -m "style: apply exact prettier output"
          git push
