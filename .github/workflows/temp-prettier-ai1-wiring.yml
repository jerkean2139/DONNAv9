name: Temporary exact Prettier AI-1 wiring
on:
  push:
    branches: [feat/ai-1-orchestrator-routing-inputs]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-1-orchestrator-routing-inputs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier packages/orchestrator/src/work-order.ts packages/orchestrator/src/orchestrator.ts packages/orchestrator/src/orchestrator.test.ts apps/worker/src/routing-decision-recorder.ts --write
      - run: pnpm exec prettier packages/orchestrator/src/work-order.ts packages/orchestrator/src/orchestrator.ts packages/orchestrator/src/orchestrator.test.ts apps/worker/src/routing-decision-recorder.ts --check
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/orchestrator/src/work-order.ts packages/orchestrator/src/orchestrator.ts packages/orchestrator/src/orchestrator.test.ts apps/worker/src/routing-decision-recorder.ts
          git commit -m "fix: apply exact Prettier output to AI-1 wiring"
          git push
