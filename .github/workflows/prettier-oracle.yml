name: Prettier Oracle
on:
  push:
    branches:
      - ci/prettier-oracle
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write apps/control-plane/src/integrations/signature.ts packages/db/src/schema/integration-events.ts
          git diff -- apps/control-plane/src/integrations/signature.ts packages/db/src/schema/integration-events.ts
