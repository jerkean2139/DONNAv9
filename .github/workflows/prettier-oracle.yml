name: Prettier Oracle
on:
  push:
    branches:
      - ci/prettier-oracle
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: pnpm exec prettier --write apps/control-plane/src/integrations/signature.ts packages/db/src/schema/integration-events.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-plane/src/integrations/signature.ts packages/db/src/schema/integration-events.ts
          git commit -m "style: apply exact prettier output"
          git push
