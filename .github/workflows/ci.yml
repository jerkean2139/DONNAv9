name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format · lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  integration:
    name: integration (live Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: donna
          POSTGRES_PASSWORD: donna
          POSTGRES_DB: donna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U donna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The skip-guarded integration harnesses run only when TEST_DATABASE_URL is
      # set — they apply the Drizzle + graphile schemas themselves and assert the
      # transactional-outbox, provisioning, tenant-scoped and task-state
      # invariants against a real database. The two runs share one database and
      # run sequentially; migrations are idempotent and every fixture row uses a
      # fresh UUID, so their data never collides.
      - name: Integration tests (control-plane)
        env:
          TEST_DATABASE_URL: postgres://donna:donna@localhost:5432/donna
        run: pnpm --filter @donna/control-plane test

      - name: Integration tests (worker)
        env:
          TEST_DATABASE_URL: postgres://donna:donna@localhost:5432/donna
        run: pnpm --filter @donna/worker test
