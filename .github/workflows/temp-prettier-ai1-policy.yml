name: Temporary exact Prettier AI-1 policy
on:
  push:
    branches: [feat/ai-1-policy-canary]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-1-policy-canary
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier packages/model-router/src/policy.ts packages/model-router/src/policy.test.ts packages/model-router/src/index.ts --write
      - run: pnpm exec prettier packages/model-router/src/policy.ts packages/model-router/src/policy.test.ts packages/model-router/src/index.ts --check
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/model-router/src/policy.ts packages/model-router/src/policy.test.ts packages/model-router/src/index.ts
          git commit -m "fix: apply exact Prettier output to AI-1 policy"
          git push
