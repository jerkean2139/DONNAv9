name: Temporary exact Prettier AI-0 finalize

on:
  push:
    branches:
      - feat/ai-0-finalize-routing-receipts

permissions:
  contents: write

jobs:
  format-receipt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-0-finalize-routing-receipts
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run exact repository Prettier
        run: pnpm exec prettier apps/worker/src/routing-decision-recorder.ts --write
      - name: Verify formatting
        run: pnpm exec prettier apps/worker/src/routing-decision-recorder.ts --check
      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/worker/src/routing-decision-recorder.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/routing-decision-recorder.ts
          git commit -m "fix: apply exact Prettier output to routing receipt recorder"
          git push
