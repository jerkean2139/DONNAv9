<svg xmlns="http://www.w3.org/2000/svg" viewBox="106 70 300 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1a12"/>
      <stop offset="1" stop-color="#0e0d0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1c6a4"/>
      <stop offset="1" stop-color="#dfa783"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e3824"/>
      <stop offset="1" stop-color="#1c110a"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23201c"/>
      <stop offset="1" stop-color="#151310"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="232" r="220" fill="url(#glow)"/>

  <!-- hair, back layer: shoulder-length with volume -->
  <path d="M150 240 C132 150 184 88 262 88 C342 88 392 150 376 244 C370 292 384 330 400 352 C372 372 330 370 306 356 L206 356 C182 370 140 372 112 352 C128 330 150 290 150 240 Z" fill="url(#hair)"/>

  <!-- neck -->
  <path d="M228 300 L284 300 L290 372 C272 390 240 390 222 372 Z" fill="#d49b78"/>
  <path d="M228 318 C246 330 266 330 284 318 L284 300 L228 300 Z" fill="#c48a68" opacity="0.6"/>

  <!-- blazer with lapels over an accent top -->
  <path d="M88 512 C92 420 160 372 256 372 C352 372 420 420 424 512 Z" fill="url(#blazer)" stroke="#3d3730" stroke-width="4"/>
  <path d="M212 374 L256 452 L300 374 C286 368 226 368 212 374 Z" fill="#ff5b2e"/>
  <path d="M212 374 L180 392 L226 470 L256 452 Z" fill="#2e2a25"/>
  <path d="M300 374 L332 392 L286 470 L256 452 Z" fill="#2e2a25"/>

  <!-- face -->
  <path d="M166 214 C166 150 206 118 256 118 C306 118 346 150 346 214 C346 282 306 334 256 334 C206 334 166 282 166 214 Z" fill="url(#skin)"/>

  <!-- earrings -->
  <circle cx="168" cy="258" r="6" fill="#f2cf6b"/>
  <circle cx="344" cy="258" r="6" fill="#f2cf6b"/>

  <!-- hair, front: deep side part sweeping across the forehead -->
  <path d="M162 226 C150 150 196 104 258 102 C320 100 366 142 358 214 C352 180 338 160 320 148 C300 176 252 196 196 200 C182 206 170 214 162 226 Z" fill="url(#hair)"/>
  <path d="M320 148 C336 170 346 190 350 214 C356 190 352 168 340 150 Z" fill="#2a1a10" opacity="0.6"/>
  <path d="M206 150 C236 134 276 130 300 142" stroke="#6b4430" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- brows -->
  <path d="M198 214 C210 206 228 205 240 209" stroke="#3a2418" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M272 209 C284 205 302 206 314 214" stroke="#3a2418" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- eyes: almond with lash line -->
  <path d="M202 236 C210 226 232 226 240 236 C232 244 210 244 202 236 Z" fill="#ffffff"/>
  <path d="M272 236 C280 226 302 226 310 236 C302 244 280 244 272 236 Z" fill="#ffffff"/>
  <circle cx="221" cy="235" r="7.5" fill="#3b2a20"/>
  <circle cx="291" cy="235" r="7.5" fill="#3b2a20"/>
  <circle cx="223.5" cy="232.5" r="2.4" fill="#ffffff"/>
  <circle cx="293.5" cy="232.5" r="2.4" fill="#ffffff"/>
  <path d="M199 235 C208 223 234 223 243 235" stroke="#1f140d" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M269 235 C278 223 304 223 313 235" stroke="#1f140d" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="204" cy="274" rx="15" ry="8" fill="#e58a76" opacity="0.35"/>
  <ellipse cx="308" cy="274" rx="15" ry="8" fill="#e58a76" opacity="0.35"/>

  <!-- nose -->
  <path d="M258 246 C255 260 252 268 262 270" stroke="#c0835f" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- lips: confident closed smile -->
  <path d="M232 292 C244 300 268 300 280 292 C272 306 240 306 232 292 Z" fill="#b94d5f"/>
  <path d="M232 292 C246 296 266 296 280 292" stroke="#8f3547" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
